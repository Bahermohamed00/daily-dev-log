name: Daily Development Log

on:
  schedule:
    # 18:00 UTC = 20:00 in Egypt (UTC+2)
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-log:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create today's log entry
        shell: bash
        run: |
          mkdir -p daily
          TODAY="$(date -u +%Y-%m-%d)"
          FILE="daily/${TODAY}.md"
          if [ ! -f "$FILE" ]; then
            {
              echo "# Daily Development Log — ${TODAY}"
              echo
              echo "Automated daily check-in. Add a short note about what you learned, built, fixed, or practiced today."
            } > "$FILE"
          fi

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "Baher"
          git config user.email "194494152+Bahermohamed00@users.noreply.github.com"
          git add daily/
          if git diff --cached --quiet; then
            echo "No new daily entry to commit."
            exit 0
          fi
          git commit -m "chore: daily development log $(date -u +%Y-%m-%d)"
          git push
